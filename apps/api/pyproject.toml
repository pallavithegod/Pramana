[project]
name = "api"
version = "0.1.0"
description = "Air-Sankhyiki serving API — mirrors api.mospi.gov.in conventions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "apix-index",
    "collectors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
