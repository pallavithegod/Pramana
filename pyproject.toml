[project]
name = "pramana-workspace"
version = "0.1.0"
description = "Pramana local econometric agent and open-source SerpApi SDK"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
]

[tool.uv.workspace]
members = [
    "packages/apix_index",
    "services/collectors",
    "apps/api",
    "packages/pramana_sdk",
]

[tool.uv.sources]
apix-index = { workspace = true }
collectors = { workspace = true }
pramana-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "services", "apps"]
