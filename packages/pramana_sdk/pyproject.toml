[project]
name = "pramana-sdk"
version = "0.1.0"
description = "Local econometric agents: SerpApi, LangChain tools, Ollama and Kalman signals"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "apix-index>=0.1.0",
    "serpapi>=0.1.5,<2",
    "langchain>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramana"]
