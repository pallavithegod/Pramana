[project]
name = "apix-index"
version = "0.1.0"
description = "Pure index mathematics: elementary indices, GEKS-Törnqvist, BCWFI, PRISM, nowcast"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apix_index"]
