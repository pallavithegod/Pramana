[project]
name = "collectors"
version = "0.1.0"
description = "Air-Sankhyiki fare collectors: compliant scraping engine + per-source adapters"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "protego>=0.3",
    "playwright>=1.62.0",
]

[project.scripts]
collect = "collectors.run:main"
ledger = "collectors.ledger:main"
serpapi-quota = "collectors.serpapi_quota:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collectors"]
